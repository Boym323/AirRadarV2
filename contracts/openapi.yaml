openapi: 3.1.0
info:
  title: AirRadar V2 — základní API
  version: 0.1.0
  description: Zkušební kontrakty etapy G-00. Žádný endpoint nevrací živá data letadel.
servers:
  - url: http://127.0.0.1:4101
paths:
  /api/v1/health:
    get:
      operationId: health
      summary: Stav zkušební služby (nikoli potvrzení živého provozu)
      responses:
        '200':
          description: Služba odpovídá, přijímač ADS-B ještě není implementován
          content:
            application/json:
              schema:
                type: object
                required: [status, stage, live_ingest, database_connected]
                properties:
                  status: { type: string, const: bootstrap }
                  stage: { type: string, const: G-00 }
                  live_ingest: { type: boolean, const: false }
                  database_connected: { type: boolean, const: false }
  /api/v1/aircraft:
    get:
      operationId: aircraft
      summary: Prázdná testovací odpověď se stavem NOT_IMPLEMENTED
      responses:
        '200':
          description: Prázdná struktura, nikoliv živě přijatá letadla
          content:
            application/json:
              schema:
                type: object
                required: [status, source, aircraft]
                properties:
                  status: { type: string, const: NOT_IMPLEMENTED }
                  source: { type: string, const: bootstrap }
                  aircraft:
                    type: array
                    maxItems: 0
                    items: {}
  /api/v1/stream:
    get:
      operationId: stream
      summary: Zkušební SSE stream s heartbeat bez živých dat
      responses:
        '200':
          description: Stream obsahuje pouze neimplementovaný počáteční snapshot
          content:
            text/event-stream:
              schema:
                type: string


# G-01 komponenty popisují BUDOUCÍ tvar API. Stávající odpovědi endpointů
# jsou správně ponechány jako G-00 bootstrap; runtime kontrakty přepne až G-03.
components:
  schemas:
    PositionV1:
      type: object
      additionalProperties: false
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
    AircraftPublicV1:
      type: object
      additionalProperties: false
      required: [id, lastMessageAt, lastPositionAt, position, positionOrigin, stale, callsign, squawk]
      properties:
        id: { type: string, pattern: "^(icao|nonicao):[0-9a-f]{6}$" }
        lastMessageAt: { type: number }
        lastPositionAt: { type: [number, "null"] }
        position:
          oneOf:
            - $ref: "#/components/schemas/PositionV1"
            - type: "null"
        positionOrigin:
          type: string
          enum: [adsb, mlat, tisb, rebroadcast, estimated, unknown]
        stale: { type: boolean }
        callsign: { type: [string, "null"], maxLength: 8 }
        squawk: { type: [string, "null"], pattern: "^[0-7]{4}$" }
    SnapshotV1:
      type: object
      additionalProperties: false
      required: [kind, epoch, seq, generatedAt, aircraft]
      properties:
        kind: { type: string, const: snapshot }
        epoch: { type: string, minLength: 1 }
        seq: { type: integer, minimum: 0 }
        generatedAt: { type: string, format: date-time }
        aircraft:
          type: array
          items: { $ref: "#/components/schemas/AircraftPublicV1" }
    DeltaV1:
      type: object
      additionalProperties: false
      required: [kind, epoch, seq, generatedAt, upsert, removed]
      properties:
        kind: { type: string, const: delta }
        epoch: { type: string, minLength: 1 }
        seq: { type: integer, minimum: 0 }
        generatedAt: { type: string, format: date-time }
        upsert:
          type: array
          items: { $ref: "#/components/schemas/AircraftPublicV1" }
        removed:
          type: array
          uniqueItems: true
          items: { type: string, pattern: "^(icao|nonicao):[0-9a-f]{6}$" }
    ErrorV1:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
# Nejde o již implementované endpoints; sekce popisuje schválený kontrakt G-01.
x-g01-planned-contract:
  stage: G-01
  runtime: NOT_IMPLEMENTED
  releaseApiVersion: 1
  response:
    status: live
    dataSchema: "#/components/schemas/SnapshotV1"
  sse:
    path: /api/v1/stream
    full: "#/components/schemas/SnapshotV1"
    delta: "#/components/schemas/DeltaV1"
    heartbeatSeconds: 15
    deltaHz: 1
    maxSnapshotBytes: 1048576
    reconnectOnGap: true
    initialAtomicBoundary: "subscribe_and_snapshot_under_one_state_owner"
  errors:
    bad_contract: CONTRACT_INVALID
    oversized_snapshot: SNAPSHOT_TOO_LARGE
    server_unavailable: UNAVAILABLE
components:
  schemas:
    AircraftV1:
      description: G-01 cílové DTO, G-00 endpoint jej dosud nevrací
      type: object
      additionalProperties: false
      required: [aircraftKey, position, positionAtMs, stale]
      properties:
        aircraftKey:
          type: string
          pattern: '^(icao|nonicao):[0-9a-f]{6}$'
        position:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [lat, lon]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lon: { type: number, minimum: -180, maximum: 180 }
        positionAtMs: { type: [integer, 'null'], minimum: 0 }
        stale: { type: boolean }
    SnapshotV1:
      type: object
      additionalProperties: false
      required: [kind, epoch, seq, aircraft]
      properties:
        kind: { type: string, const: snapshot }
        epoch: { type: string }
        seq: { type: integer, minimum: 0 }
        aircraft:
          type: array
          items: { '$ref': '#/components/schemas/AircraftV1' }
    DeltaV1:
      type: object
      additionalProperties: false
      required: [kind, epoch, seq, upsert, removed]
      properties:
        kind: { type: string, const: delta }
        epoch: { type: string }
        seq: { type: integer, minimum: 0 }
        upsert:
          type: array
          items: { '$ref': '#/components/schemas/AircraftV1' }
        removed:
          type: array
          items: { type: string, pattern: '^(icao|nonicao):[0-9a-f]{6}$' }
