openapi: 3.1.0
info:
  title: AirRadar V2 — základní API
  version: 0.1.0
  description: Zkušební kontrakty etapy G-00. Žádný endpoint nevrací živá data letadel.
servers:
  - url: http://127.0.0.1:4101
paths:
  /api/v1/health:
    get:
      operationId: health
      summary: Stav zkušební služby (nikoli potvrzení živého provozu)
      responses:
        '200':
          description: Služba odpovídá, přijímač ADS-B ještě není implementován
          content:
            application/json:
              schema:
                type: object
                required: [status, stage, live_ingest, database_connected]
                properties:
                  status: { type: string, const: bootstrap }
                  stage: { type: string, const: G-00 }
                  live_ingest: { type: boolean, const: false }
                  database_connected: { type: boolean, const: false }
  /api/v1/aircraft:
    get:
      operationId: aircraft
      summary: Prázdná testovací odpověď se stavem NOT_IMPLEMENTED
      responses:
        '200':
          description: Prázdná struktura, nikoliv živě přijatá letadla
          content:
            application/json:
              schema:
                type: object
                required: [status, source, aircraft]
                properties:
                  status: { type: string, const: NOT_IMPLEMENTED }
                  source: { type: string, const: bootstrap }
                  aircraft:
                    type: array
                    maxItems: 0
                    items: {}
  /api/v1/stream:
    get:
      operationId: stream
      summary: Zkušební SSE stream s heartbeat bez živých dat
      responses:
        '200':
          description: Stream obsahuje pouze neimplementovaný počáteční snapshot
          content:
            text/event-stream:
              schema:
                type: string
