name: AirRadar V2 — G-04 izolovaný PostgreSQL test
on:
  push:
    branches: [main]
    paths:
      - 'database/migrations/**'
      - 'tools/test_g04_migrations.sh'
      - '.github/workflows/g04-postgres-migrations.yml'
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'tools/test_g04_migrations.sh'
      - '.github/workflows/g04-postgres-migrations.yml'
      - 'apps/engine/src/history_store.rs'
      - 'apps/engine/Cargo.toml'
      - 'Cargo.lock'
      - 'apps/engine/src/history.rs'
      - 'apps/engine/src/ingest/state.rs'
      - 'apps/engine/src/contract.rs'
      - 'apps/engine/src/ingest/mode_s.rs'
      - 'apps/engine/src/ingest/supervisor.rs'
      - 'tools/test_g04_backup_restore.sh'
      - 'database/maintenance/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g04-postgres-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr_reuse:
    name: Najít bezpečně znovupoužitelný PR PostgreSQL test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reusable: ${{ steps.check.outputs.reusable }}
    steps:
      - uses: actions/checkout@v7
      - name: Porovnat reálný merge Git tree s PR důkazem
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci_reuse_gate.py verify \
            --workflow g04-postgres-migrations.yml \
            --repo "$GITHUB_REPOSITORY" --main-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

  isolated-postgres:
    needs: pr_reuse
    if: always() && (github.event_name != 'push' || (needs.pr_reuse.result == 'success' && needs.pr_reuse.outputs.reusable != 'true'))
    name: G-04.04 — migrace a SQL integrita (jen CI)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: airradar_v2_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-temporary-not-a-real-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airradar_v2_dev"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: airradar_v2_dev
      PGUSER: postgres
      PGPASSWORD: ci-temporary-not-a-real-secret
      # Pouze izolovaný lokální kontejner bez TLS; odpovídá ADR 0009 pro důvěryhodnou LAN.
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - name: Instalovat PostgreSQL klienta
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Ověřit migraci, integritu a oddělení práv
        run: bash tools/test_g04_migrations.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: SQLx integrační test J09 ve stejném izolovaném PostgreSQL
        env:
          AIRRADAR_G04_CI_DATABASE_URL: postgres://postgres:ci-temporary-not-a-real-secret@127.0.0.1:5432/airradar_v2_dev?sslmode=disable
        run: |
          cargo test --locked -p airradarv2-engine g04_postgres_batch_dedup_and_bounded_history
          cargo test --locked -p airradarv2-engine g04_beast_only_cpr_ram_sampler_sqlx_postgres_regression
          cargo test --locked -p airradarv2-engine g04_explicit_lan_connection_has_no_tls_in_ci
      - name: Skutečný izolovaný pg_dump/pg_restore a jednorázová retence
        run: bash tools/test_g04_backup_restore.sh
      - name: G-04.09 — ohraničená údržba 30 dnů s oddělenou SQL rolí
        run: bash tools/test_g04_retention_bounded.sh


  pr-reuse-proof:
    name: Důkaz izolovaného PostgreSQL testu PR
    if: github.event_name == 'pull_request'
    needs: isolated-postgres
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Zaznamenat otestovaný merge Git tree
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/ci_reuse_gate.py create \
            --workflow g04-postgres-migrations.yml \
            --pr "$PR_NUMBER" --head "$PR_HEAD_SHA" \
            --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --output validated-pr-tree.json
      - uses: actions/upload-artifact@v4
        with:
          name: validated-g04-postgres-migrations-${{ github.run_id }}-${{ github.run_attempt }}
          path: validated-pr-tree.json
          if-no-files-found: error
          retention-days: 7
