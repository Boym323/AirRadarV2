name: AirRadar V2 · DEV release
on:
  push:
    branches: [main]
    # Denní commit statistik nemění aplikaci: žádný release ani restart DEV LXC.
    # Jiné soubory v tomtéž commitu stále workflow spustí.
    paths-ignore:
      - 'README.md'
      - 'docs/metrics/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: airradarv2-dev-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pr_reuse:
    name: CI · Ověření PR
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reusable: ${{ steps.check.outputs.reusable }}
    steps:
      - uses: actions/checkout@v7
      - name: CI · Shoda Git tree
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci_reuse_gate.py verify --workflow ci.yml \
            --repo "$GITHUB_REPOSITORY" --main-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

  validate:
    name: CI · Úplná validace
    needs: pr_reuse
    if: needs.pr_reuse.outputs.reusable != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  test-and-build:
    name: DEV · Sestavit artefakt
    needs: [pr_reuse, validate]
    if: always() && needs.pr_reuse.result == 'success' && (needs.pr_reuse.outputs.reusable == 'true' || needs.validate.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: DEV · Rust a web build
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo build --locked --release -p airradarv2-engine
          cd apps/web
          npm ci --no-audit --no-fund
          VITE_APP_VERSION="$GITHUB_SHA" npm run build
          cd ../..
      - name: DEV · Balíček pro LXC
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d package/web
          install -m 0755 target/release/airradarv2-engine package/airradarv2-engine
          cp -a apps/web/dist/. package/web/
          # G04_STAGE_GATE_V3 — the committed runtime stage is the single
          # release input for the DEV installer; future stages advance this
          # file together with their code, tests and acceptance evidence.
          runtime_stage="$(tr -d '\r\n' < deploy/runtime-stage)"
          case "$runtime_stage" in G-03|G-04) ;; *)
            echo "Neplatná deploy/runtime-stage: $runtime_stage" >&2; exit 1;;
          esac
          printf '%s\n' "$runtime_stage" > package/web/runtime-stage.txt
          if test "$runtime_stage" = G-03 || test "$runtime_stage" = G-04; then
            printf 'G-03\n' > package/web/g03-runtime-required.txt
          fi
          printf '%s\n' "$GITHUB_SHA" > package/VERSION
          filename="airradarv2-dev-linux-amd64-$(printf '%s' "$GITHUB_SHA" | cut -c1-12).tar.gz"
          tar -C package -czf "$filename" .
          sha256sum "$filename" > "$filename.sha256"
          tar -tzf "$filename" > /tmp/airradarv2-archive.list
          grep -qx './airradarv2-engine' /tmp/airradarv2-archive.list
          grep -qx './VERSION' /tmp/airradarv2-archive.list
          grep -qx './web/index.html' /tmp/airradarv2-archive.list
      - name: G04 · Kontrola stage
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Eq '^G-(03|04)$' package/web/runtime-stage.txt
          test -f package/web/g03-runtime-required.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g02-dev-${{ github.sha }}
          path: |
            airradarv2-dev-linux-amd64-*.tar.gz
            airradarv2-dev-linux-amd64-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
  publish-dev-candidate:
    needs: test-and-build
    # Každý main commit po úspěšných testech automaticky publikuje
    # immutable prerelease; G-03 režim bezpečně přepne až root installer.
    if: github.repository == 'Boym323/AirRadarV2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: g02-dev-${{ github.sha }}
      - name: DEV · Publikovat release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          sha256sum -c ./*.tar.gz.sha256
          tag="g02-dev-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release uz existuje: $tag"
            exit 0
          fi
          gh release create "$tag" \
            ./*.tar.gz ./*.tar.gz.sha256 \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "AirRadarV2 DEV release $GITHUB_SHA" \
            --notes "Ověřený CI artefakt pro izolovaný DEV deployment; bez zásahu do V1, DB nebo přijímače."

  deploy-dev:
    name: DEV · Nasazení
    needs: publish-dev-candidate
    if: github.repository == 'Boym323/AirRadarV2' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, airradarv2-dev]
    timeout-minutes: 120
    permissions:
      contents: read
    concurrency:
      group: airradarv2-dev-deployment
      cancel-in-progress: false
    steps:
      - name: DEV · Stáhnout artefakt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          short="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          name="airradarv2-dev-linux-amd64-${short}.tar.gz"
          incoming=/var/lib/airradarv2-runner/incoming
          umask 077
          mkdir -p "$incoming"
          staging="$incoming/${GITHUB_SHA}.${GITHUB_RUN_ID}"
          mkdir "$staging"
          trap 'status=$?; if [ "$status" -ne 0 ]; then rm -rf -- "$staging"; fi; exit "$status"' EXIT
          release="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/g02-dev-${GITHUB_SHA}")"
          jq -e --arg sha "$GITHUB_SHA" --arg name "$name" \
            '.tag_name == ("g02-dev-" + $sha) and .target_commitish == $sha and .prerelease == true and .draft == false and .author.login == "github-actions[bot]" and ([.assets[].name] | sort) == [$name, ($name + ".sha256")]' \
            <<<"$release"
          for suffix in .tar.gz .tar.gz.sha256; do
            asset="${name}${suffix#\.tar.gz}"
            url="$(jq -r --arg n "$asset" '.assets[] | select(.name == $n) | .url' <<<"$release")"
            test -n "$url" -a "$url" != null
            curl -fsSL --location -H 'Accept: application/octet-stream' -H "Authorization: Bearer ${GH_TOKEN}" "$url" -o "$staging/$asset"
          done
          (cd "$staging" && sha256sum -c "$name.sha256")
          python3 - "$staging/$name" "$GITHUB_SHA" <<'PY'
          import sys, tarfile
          archive, expected = sys.argv[1:]
          with tarfile.open(archive, 'r:gz') as bundle:
              version = next((item for item in bundle.getmembers()
                              if item.name in ('VERSION', './VERSION')), None)
              if version is None or not version.isfile():
                  raise SystemExit('VERSION is missing or not a regular file')
              actual = bundle.extractfile(version).read(256).decode('ascii').strip()
          if actual != expected:
              raise SystemExit('VERSION does not match GITHUB_SHA')
          PY
          # A metrics-only main push may occur while the previous SHA is being
          # built. Permit this narrow non-app race, never an unknown code commit.
          current_main="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" | jq -r '.object.sha')"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "main se během vydávání posunul; kontroluji výhradně bot metriky."
            compare="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${current_main}")"
            jq -e --arg base "$GITHUB_SHA" --arg head "$current_main" '
              .status == "ahead" and .base_commit.sha == $base and
              .ahead_by > 0 and .ahead_by <= 3 and
              (.commits | length) == .ahead_by and
              .commits[-1].sha == $head
            ' <<<"$compare" >/dev/null
            parent="$GITHUB_SHA"
            while IFS= read -r metric_sha; do
              metadata="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${metric_sha}")"
              jq -e --arg sha "$metric_sha" --arg parent "$parent" '
                .sha == $sha and (.parents | length) == 1 and
                .parents[0].sha == $parent and
                .author.login == "github-actions[bot]" and
                .committer.login == "github-actions[bot]" and
                .commit.message == "docs: automatická aktualizace statistik vývoje" and
                (.files | length) > 0 and
                all(.files[];
                  .status == "modified" and
                  (.filename == "README.md" or (.filename | startswith("docs/metrics/"))))
              ' <<<"$metadata" >/dev/null
              parent="$metric_sha"
            done < <(jq -r '.commits[].sha' <<<"$compare")
            test "$parent" = "$current_main"
            echo "::notice::Mezilehlé commity mění jen README/metriky; nasazuji aplikaci $GITHUB_SHA."
          fi
          tar -tzf "$staging/$name" > "$staging/archive.list"
          grep -Eq '^\./(VERSION|airradarv2-engine|web/index\.html)$' "$staging/archive.list"
          # G04_STAGE_GATE_V2: fail BEFORE deploying if root installer is stale.
          if grep -qx './web/runtime-stage.txt' "$staging/archive.list"; then
            if ! grep -qF 'G04_STAGE_GATE_V3' /usr/local/libexec/airradarv2-main-deploy-install.sh ||
               ! test -r /usr/local/libexec/verify-airradarv2-runtime.py; then
              echo "::error::Jednorázově na V2 DEV LXC spusť: bash deploy/activate-g03-main-autodeploy.sh"
              exit 1
            fi
          fi
      - name: DEV · Nasadit s retry
        shell: bash
        run: |
          set -Eeuo pipefail
          short="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          bundle="/var/lib/airradarv2-runner/incoming/${GITHUB_SHA}.${GITHUB_RUN_ID}/airradarv2-dev-linux-amd64-${short}.tar.gz"
          staging="${bundle%/*}"
          trap 'rm -rf -- "$staging"' EXIT
          for attempt in $(seq 1 240); do
            set +e
            sudo -n /usr/local/libexec/airradarv2-runner-deploy.sh "$bundle" "$GITHUB_SHA"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$status" -ne 75 ]; then exit "$status"; fi
            echo "G-02 právě běží; další pokus za 30 s ($attempt/240)"
            sleep 30
          done
          exit 75
      - name: DEV · Souhrn
        run: echo "DEV deployment dokončen pro $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: DEV · Kontrola nasazení
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          current=/opt/airradar-v2/current
          expected_release_root=/opt/airradar-v2/releases/
          test "$(systemctl is-active airradarv2-engine.service)" = active
          test "$(systemctl is-active nginx.service)" = active
          test -L "$current"
          resolved="$(readlink -f -- "$current")"
          case "$resolved" in
            "$expected_release_root"*) ;;
            *) echo "current míří mimo izolovaný releases adresář: $resolved" >&2; exit 1 ;;
          esac
          test "$(tr -d '\r\n' < "$current/VERSION")" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import json, urllib.request

          request = urllib.request.Request("http://127.0.0.1:4101/api/v1/health")
          with urllib.request.urlopen(request, timeout=5) as response:
              if response.status != 200:
                  raise SystemExit(f"API health HTTP {response.status}")
              health = json.load(response)
          import pathlib
          stage = pathlib.Path("/opt/airradar-v2/current/web/runtime-stage.txt").read_text().strip()
          if stage not in {"G-03", "G-04"}:
              raise SystemExit(f"neznámý runtime stage: {stage}")
          if health.get("stage") != stage or health.get("status") not in {"live", "waiting_for_observations"}:
              raise SystemExit("nasazený runtime neodpovídá release stage nebo je degradovaný")
          if health.get("live_ingest") is not (health["status"] == "live"):
              raise SystemExit("health neodpovídá realitě živého příjmu")
          if health.get("database_connected") is not (stage == "G-04"):
              raise SystemExit("health neodpovídá deklarovanému DB runtime stage")
          PY
          web_check="$RUNNER_TEMP/airradarv2-web-health.html"
          curl --fail --silent --show-error --max-time 5 \
            --output "$web_check" http://192.168.1.126:8080/
          grep -q '<div id="root"></div>' "$web_check"
          if test -f "$current/web/runtime-stage.txt"; then
            python3 /usr/local/libexec/verify-airradarv2-runtime.py \
              --expected-stage "$(tr -d '\r\n' < "$current/web/runtime-stage.txt")" \
              --direct http://127.0.0.1:4101 \
              --proxy http://192.168.1.126:8080
          fi
          sleep 3
          test "$(systemctl is-active airradarv2-engine.service)" = active
          test "$(systemctl is-active nginx.service)" = active
          echo "PASS: DEV release, služby, API a web odpovídají SHA $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
