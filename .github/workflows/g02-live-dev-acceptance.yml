name: AirRadar V2 — G-02 LIVE přejímka (DEV)
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: "Schválený immutable G-02 DEV release SHA"
        required: true
        type: string
        default: d0cefc4a5c3332eadccf8ab21c96bae51987abe9
      confirm:
        description: "Výslovné potvrzení read-only 60min BEAST testu v DEV LXC"
        required: true
        type: choice
        options:
          - NE_SPOUSTET
          - SPUSTIT_READONLY_60MIN

permissions:
  contents: read
concurrency:
  group: g02-live-dev-only
  cancel-in-progress: false

jobs:
  request:
    name: Vydat schválený požadavek (bez LAN přístupu)
    if: github.event.inputs.confirm == 'SPUSTIT_READONLY_60MIN'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.create.outputs.sha }}
      run_id: ${{ steps.create.outputs.run_id }}
    steps:
      - id: create
        name: Ověřit schválený DEV release a vydat jednorázový požadavek
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ inputs.approved_sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GH_REPO" == "Boym323/AirRadarV2" ]] || exit 1
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Chybné SHA"; exit 1; }
          json="$(gh api "repos/$GH_REPO/releases/tags/g02-dev-$SHA")"
          jq -e --arg sha "$SHA" '
            .prerelease == true and .draft == false and
            .target_commitish == $sha and
            (.assets | map(.name) | any(. == ("airradarv2-dev-linux-amd64-" + $sha[0:12] + ".tar.gz")))
          ' <<<"$json" >/dev/null
          tag="g02-live-$SHA-$RUN_ID"
          gh release create "$tag" \
            --target "$SHA" --prerelease --latest=false \
            --title "G-02.11 LIVE read-only DEV request $RUN_ID" \
            --notes "GitHub Actions run $RUN_ID: pouze schválený 60min BEAST OUTPUT 30005 test; žádné příkazy, IP ani změny V1."
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Request $tag publikován."

  verify:
    name: Počkat na skutečný 60min výsledek DEV LXC
    needs: request
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    permissions:
      contents: read
    env:
      EXPECTED_SHA: ${{ needs.request.outputs.sha }}
      EXPECTED_RUN_ID: ${{ needs.request.outputs.run_id }}
    steps:
      - name: Ověřit veřejný report, SHA, request ID a živé metriky
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 79); do
            if curl -fsSL --max-time 12 -o /tmp/g02-status.json \
              "https://airradarv2.pomykal.cz/g02-status.json"; then
              if python3 - <<'PY'
          import json, os, sys
          with open("/tmp/g02-status.json", encoding="utf-8") as f:
              status = json.load(f)
          sha = os.environ["EXPECTED_SHA"]
          run_id = int(os.environ["EXPECTED_RUN_ID"])
          result = status.get("liveSoak") or {}
          if status.get("sha") != sha or result.get("requestRunId") != run_id:
              sys.exit(2)
          state = result.get("status")
          if state == "RUNNING":
              print("DEV LXC: běží live test")
              sys.exit(2)
          if (state == "PASS_LIVE_BEAST_60MIN"
                  and result.get("sha") == sha
                  and float(result.get("durationSec", 0)) >= 3595
                  and int(result.get("channelDrops", -1)) == 0
                  and int(result.get("capacityDrops", -1)) == 0
                  and int(result.get("receivedObservationsAtLeast", 0)) > 0
                  and int(result.get("peakRssKiB", 10**9)) < 262144):
              print("PASS: 60min readonly BEAST na DEV LXC pro přesný SHA a ID.")
              print("CPU=%s%% RSS_peak=%sKiB tracks_peak=%s pozorování=%s" % (
                  result.get("averageCpuPercent"), result.get("peakRssKiB"),
                  result.get("peakTracks"), result.get("receivedObservationsAtLeast")))
              sys.exit(0)
          print("FAIL/INCONCLUSIVE: liveSoak=%s" % state)
          sys.exit(1)
          PY
              then
                exit 0
              else
                rc=$?
                if [ "$rc" -eq 1 ]; then
                  echo "G-02.11 live přejímka neprošla."
                  exit 1
                fi
              fi
            fi
            echo "Čekání na DEV LXC: pokus $i/79"
            if [ "$i" -lt 79 ]; then sleep 60; fi
          done
          echo "NEOVĚŘENO: DEV LXC nepotvrdilo test v limitu."
          exit 1
