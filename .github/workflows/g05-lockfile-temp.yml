name: G-05 jednorázové vygenerování npm lockfile
on:
  push:
    branches: [codex/g05-map-20261023]
    paths:
      - 'apps/web/package.json'
      - '.github/workflows/g05-lockfile-temp.yml'
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/g05-map-20261023
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Deterministický npm package-lock bez instalace balíčků
        run: npm install --package-lock-only --no-audit --no-fund --prefix apps/web
      - name: Aktualizovat pouze lockfile ve stejné G-05 větvi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(G-05): synchronizovat npm lockfile pro MapLibre"
            git push origin HEAD:codex/g05-map-20261023
          fi
