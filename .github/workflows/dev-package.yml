name: AirRadar V2 — sestavit DEV LXC balíček (bez nasazení)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: airradarv2-dev-package
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Ověřit Rust a TypeScript
        run: |
          set -Eeuo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cd apps/web
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
      - name: Sestavit hotové artefakty pro Debian 13 x86_64
        run: |
          set -Eeuo pipefail
          cargo build --release --locked -p airradarv2-engine
          cd apps/web
          npm run build
          cd ../..
          install -d package/web
          install -m 0755 target/release/airradarv2-engine package/airradarv2-engine
          cp -a apps/web/dist/. package/web/
          printf '%s\n' "$GITHUB_SHA" > package/VERSION
          filename="airradarv2-dev-linux-amd64-$(printf '%s' "$GITHUB_SHA" | cut -c1-12).tar.gz"
          tar -C package -czf "$filename" .
          sha256sum "$filename" > "$filename.sha256"
          test -s apps/web/dist/index.html
          tar -tzf "$filename" | grep -q './airradarv2-engine'
          tar -tzf "$filename" | grep -q './web/index.html'
      - name: Uložit pro ruční stažení
        uses: actions/upload-artifact@v4
        with:
          name: airradarv2-dev-${{ github.sha }}
          path: |
            airradarv2-dev-linux-amd64-*.tar.gz
            airradarv2-dev-linux-amd64-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
