# UKÁZKA PRO BUDOUCÍ V2 RELEASE. NIC AUTOMATICKY NENASAZUJE.
# Naslouchá pouze na 127.0.0.1:8080. Vnější HTTPS ingress/TLS je samostatně spravovaný.
server {
    listen 127.0.0.1:8080;
    server_name _;
    root /opt/airradar-v2/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
