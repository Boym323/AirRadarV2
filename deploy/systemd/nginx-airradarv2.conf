[Unit]
# DHCP in the DEV LXC may assign the address shortly after network-online.target.
# Keep the private-address binding, but retry instead of leaving nginx dead.
After=network-online.target networking.service
Wants=network-online.target
StartLimitIntervalSec=60s
StartLimitBurst=30

[Service]
Restart=on-failure
RestartSec=2s
